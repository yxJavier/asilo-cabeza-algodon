spring.application.name=cabeza-algodon-api

# ==========================================
# Conexión con PostgreSQL en Docker
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/asilo_cabeza_algodon
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Pool de Conexiones HikariCP (Líneas Vivas)
# ==========================================
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ==========================================
# Hibernate / JPA
# ==========================================
# 'update' creará automáticamente las tablas en Postgres al detectar tus clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false