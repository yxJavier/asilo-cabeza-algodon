services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-asilo
    environment:
      POSTGRES_DB: asilo_cabeza_algodon
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_asilo:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata_asilo: